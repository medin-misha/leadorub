# ============================================================================
# Leadorub — инфраструктурный слой.
# Запуск (из папки infra/):  docker compose -f docker-compose.infra.yml up -d
# Переменные берутся из infra/.env (см. .env.example).
#
# Сервисы общаются с приложениями (docker-compose.apps.yml) через внешнюю
# сеть `leadorub`, которую создаёт этот файл.
# ============================================================================

name: leadorub-infra

services:
  # --------------------------------------------------------------------------
  # PostgreSQL — основная реляционная БД (бэкенд, asyncpg).
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - leadorub

  # --------------------------------------------------------------------------
  # Redis — result backend и source расписаний для taskiq.
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly — persistence: данные переживут перезапуск контейнера.
    # requirepass — Redis закрыт паролем (единый источник — ${redis_password}).
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${redis_password}"]
    volumes:
      - redis_data:/data
    healthcheck:
      # healthcheck тоже авторизуется, иначе ping вернёт NOAUTH и контейнер
      # никогда не станет healthy.
      test: ["CMD", "redis-cli", "-a", "${redis_password}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - leadorub

  # --------------------------------------------------------------------------
  # RabbitMQ — брокер сообщений (aio-pika, taskiq). С management-UI на :15672.
  # --------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "15672:15672"  # management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - leadorub

  # --------------------------------------------------------------------------
  # MinIO — S3-совместимое хранилище для file_module.
  # API на :9000, веб-консоль на :9001.
  # --------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Внешний URL консоли за edge-Caddy. Раскомментируй, если консоль на
      # поддомене minio.<IP>.sslip.io редиректит после логина не туда.
      # MINIO_BROWSER_REDIRECT_URL: https://minio.${PUBLIC_HOST}
    ports:
      - "9001:9001"  # консоль
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - leadorub

  # --------------------------------------------------------------------------
  # MinIO init — одноразовый контейнер: создаёт бакет приложения и выходит.
  # mc retry'ит alias до готовности MinIO, поэтому отдельный healthcheck не нужен.
  # --------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
        mc mb --ignore-existing "local/$$MINIO_BUCKET";
        echo "bucket '$$MINIO_BUCKET' ready";
    networks:
      - leadorub

  # --------------------------------------------------------------------------
  # Loki — хранилище логов (источник данных для Grafana).
  # --------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.4
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - leadorub

  # --------------------------------------------------------------------------
  # Grafana Alloy — собирает логи docker-контейнеров и пушит их в Loki.
  # Нужен доступ к docker-сокету (ro), чтобы видеть контейнеры и их логи.
  # --------------------------------------------------------------------------
  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - leadorub

  # --------------------------------------------------------------------------
  # Grafana — дашборды и просмотр логов. Datasource Loki провижнится автоматически.
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Отключаем анонимную телеметрию и установку плагинов наружу в dev.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Внешний URL за reverse-proxy — иначе редиректы и абсолютные ссылки ломаются.
      GF_SERVER_ROOT_URL: https://grafana.${PUBLIC_HOST}
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - leadorub

  # --------------------------------------------------------------------------
  # Caddy — edge reverse proxy. Единственный сервис, открытый наружу (80/443).
  # Терминирует HTTPS (Let's Encrypt через sslip.io) и проксирует по хостнейму
  # на внутренние сервисы. PUBLIC_HOST (<IP>.sslip.io) берётся из infra/.env и
  # пробрасывается в контейнер — Caddyfile читает его как {$PUBLIC_HOST}.
  # depends_on не указываем намеренно: reverse_proxy сам ретраит апстримы,
  # пока они поднимаются (вернёт 502 до готовности), а admin_miniapp вообще из
  # другого compose-файла — зависимость между файлами невозможна.
  # --------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 (QUIC)
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # сертификаты — переживают рестарт
      - caddy_config:/config
    networks:
      - leadorub

# ----------------------------------------------------------------------------
# Именованные volumes — данные переживают пересоздание контейнеров.
# ----------------------------------------------------------------------------
volumes:
  pg_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  loki_data:
  grafana_data:
  caddy_data:
  caddy_config:

# ----------------------------------------------------------------------------
# Общая сеть для infra и apps. Создаётся этим файлом с фиксированным именем,
# apps-compose подключается к ней как external.
# ----------------------------------------------------------------------------
networks:
  leadorub:
    name: leadorub
    driver: bridge
