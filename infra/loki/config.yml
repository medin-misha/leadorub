# Loki в режиме single-binary с хранением на файловой системе.
# Для dev/небольшого прода этого достаточно: индексы и чанки лежат в volume.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Схема v13 + tsdb — актуальный формат индекса для Loki 3.x.
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Разрешаем structured metadata — нужно loki.source.docker из Alloy.
  allow_structured_metadata: true
  # Удерживаем логи 7 дней, чтобы volume не разрастался бесконтрольно.
  retention_period: 168h

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
