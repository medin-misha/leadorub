[project]
name = "telegram-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aio-pika>=9.5.8",
    "aiohttp>=3.12.15",
    "aiogram>=3.27.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.0",
    "redis>=8.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Базовый gate без массового форматирования существующего кода.
select = ["E9", "F"]
