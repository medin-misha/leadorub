[project]
name = "fastapi-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aio-pika>=9.5.8",
    "aiobotocore>=3.7.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.136.1",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.27",
    "sqlalchemy>=2.0.49",
    "taskiq>=0.12.4",
    "taskiq-aio-pika>=0.6.0",
    "taskiq-redis>=1.0.0",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Базовый gate без массового форматирования существующего кода.
select = ["E9", "F"]
